[project]
name = "hate-crime-dashboard"
version = "1.0.0"
description = "FBI Hate Crime Statistics 2024 — Dashboard interactif Dash + Plotly"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
